# Publication d'une version : git tag v1.2.0 && git push --tags
# Construit Mac et Windows, signe les mises à jour avec votre clé (secret UPDATE_PRIVATE_KEY) et crée la page de la version sur GitHub.
name: Publication
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  construire:
    strategy:
      fail-fast: true
      matrix:
        os: [windows-latest, macos-26]  # macOS 26 : la dictée vocale de Mac (tools/dictate) a besoin de son SDK
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Numéro de version
        shell: bash
        run: |
          V="${GITHUB_REF_NAME#v}"
          echo "VERSION=$V" >> "$GITHUB_ENV"
          python -c "import re,pathlib;p=pathlib.Path('mailia/version.py');p.write_text(re.sub(r'APP_VERSION = \"[^\"]*\"','APP_VERSION = \"$V\"',p.read_text(),count=1))"
      - name: Dépôt des versions
        shell: bash
        run: python -c "import re,pathlib,os;p=pathlib.Path('mailia/version.py');p.write_text(re.sub(r'UPDATE_REPO = \"[^\"]*\"','UPDATE_REPO = \"'+os.environ['GITHUB_REPOSITORY']+'\"',p.read_text(),count=1))"
      - name: Dépendances
        shell: bash
        run: |
          python -m venv .venv
          PY=$([ "$RUNNER_OS" = Windows ] && echo .venv/Scripts/python || echo .venv/bin/python)
          $PY -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Avis de sécurité des dépendances
        shell: bash
        run: |
          PY=$([ "$RUNNER_OS" = Windows ] && echo .venv/Scripts/python || echo .venv/bin/python)
          $PY -m pip install pip-audit
          # une version qui embarque une bibliothèque avec une faille connue n'est pas publiée (pour passer outre un avis sans objet : ajouter --ignore-vuln <identifiant>)
          $PY -m pip_audit -r requirements.txt
      - name: Tests
        shell: bash
        run: |
          PY=$([ "$RUNNER_OS" = Windows ] && echo .venv/Scripts/python || echo .venv/bin/python)
          $PY -m pytest -q -m "not network"
      - name: Certificat de signature Mac
        if: runner.os == 'macOS'
        env:
          MAC_CERT_P12: ${{ secrets.MAC_CERT_P12 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
        run: |
          # Une identité de signature fixe d'une version à l'autre : le trousseau et les autorisations de macOS (Chrome, micro…) ne redemandent pas de mot de passe après chaque mise à jour.
          # Sans ce secret (copie du dépôt, par exemple) : signature « ad hoc », comme avant.
          if [ -n "$MAC_CERT_P12" ]; then
            KC="$RUNNER_TEMP/velora-signing.keychain-db"; KPW=$(uuidgen)
            echo "$MAC_CERT_P12" | base64 --decode > "$RUNNER_TEMP/velora.p12"
            security create-keychain -p "$KPW" "$KC"
            security set-keychain-settings -lut 3600 "$KC"
            security unlock-keychain -p "$KPW" "$KC"
            security import "$RUNNER_TEMP/velora.p12" -k "$KC" -P "$MAC_CERT_PASSWORD" -T /usr/bin/codesign
            security set-key-partition-list -S apple-tool:,apple: -s -k "$KPW" "$KC" > /dev/null
            security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
            rm -f "$RUNNER_TEMP/velora.p12"
            ID=$(security find-identity -p codesigning "$KC" | awk '/Velora Release Signing/ {print $2; exit}')
            test -n "$ID" || { echo "certificat de signature introuvable"; exit 1; }
            echo "CODESIGN_IDENTITY=$ID" >> "$GITHUB_ENV"
          else
            echo "pas de certificat de signature : signature ad hoc"
          fi
      - name: Construction et empaquetage Mac
        if: runner.os == 'macOS'
        run: |
          ./build_mac.sh
          if [ -n "$CODESIGN_IDENTITY" ]; then codesign -d -r- dist/Velora.app 2>&1 | grep -q 'certificate leaf' || { echo "signature stable absente"; exit 1; }; fi  # l'identité doit être celle du certificat, pas ad hoc
          test -x dist/Velora.app/Contents/MacOS/velora-dictate  # la dictée ne doit pas disparaître en silence d'une version publiée
          test -x dist/Velora.app/Contents/MacOS/velora-write  # ni les boutons Apple Intelligence
          scripts/package_mac.sh "$VERSION"
      - name: Construction et installateur Windows
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          call build_windows.bat
          choco install innosetup -y --no-progress
          "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DAppVersion=%VERSION% scripts\velora.iss
      - name: Signature des mises à jour
        shell: bash
        env:
          UPDATE_PRIVATE_KEY: ${{ secrets.UPDATE_PRIVATE_KEY }}
        run: |
          PY=$([ "$RUNNER_OS" = Windows ] && echo .venv/Scripts/python || echo .venv/bin/python)
          for f in dist/release/*-mac.zip dist/release/*-setup.exe; do [ -f "$f" ] && $PY tools/sign_release.py --version "$VERSION" "$f"; done
          ls dist/release/*.sig2 > /dev/null  # la signature liée à la version ne doit pas disparaître en silence (échec ici = pas de publication)
          ls -l dist/release
      - uses: actions/upload-artifact@v4
        with:
          name: velora-${{ runner.os }}
          path: dist/release/*
          retention-days: 3
  publier:
    needs: construire
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: fichiers
          merge-multiple: true
      - name: Page de la version
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" fichiers/* --repo "$GITHUB_REPOSITORY" --title "Velora ${GITHUB_REF_NAME#v}" --generate-notes
